<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f0e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<title>Meu Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 560px) com abas embaixo, conteúdo rolando no meio,
   botão "+" flutuante e folha de lançamento subindo de baixo. Tinta quase preta como ação principal;
   a cor fica toda nos dados (paleta categórica validada de 8 cores). */
:root{
  --bg:#f2f4f3; --surface:#fcfcfb; --ink:#101412; --ink2:#4b5350; --muted:#6f7773;
  --line:#e0e4e2; --line2:#c9cfcc; --chip:#e6eae8; --on-ink:#ffffff; --danger:#b3261e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --font-display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f0e; --surface:#1a1a19; --ink:#f2f4f3; --ink2:#c3c2b7; --muted:#9a9a93;
    --line:#2c2c2a; --line2:#3d3d3a; --chip:#262826; --on-ink:#101412; --danger:#ff8a80;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f0e; --surface:#1a1a19; --ink:#f2f4f3; --ink2:#c3c2b7; --muted:#9a9a93;
  --line:#2c2c2a; --line2:#3d3d3a; --chip:#262826; --on-ink:#101412; --danger:#ff8a80;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.status{font-size:12px;color:var(--ink2);text-align:right}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-block:4px}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:8px 120px;-webkit-overflow-scrolling:touch}
main>*{min-width:0}
.muted{color:var(--ink2)}
.pad{padding-block:24px}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-inline:-16px;padding:6px 4px 8px;border-top:1px solid var(--line);background:var(--bg)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);padding:4px 0;cursor:pointer;min-width:0}
.tab .ico{width:44px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ico{background:var(--chip)}
.fab{position:absolute;right:16px;bottom:84px;width:58px;height:58px;border-radius:18px;background:var(--ink);color:var(--on-ink);border:0;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}

.mnav{display:flex;align-items:center;justify-content:space-between;margin-block:2px 8px}
.mnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.mlabel{font-family:var(--font-display);font-weight:700;font-size:18px}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,12vw,54px);line-height:1.05;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.mid{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.01em;margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.pair .k{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.pair .v{display:block;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 8px}
.sec h2{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0}
.link{background:none;border:0;font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.dayh{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:700;color:var(--ink2);margin:20px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.dayh+.row{}

.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px;margin-block:8px}
.seg button{flex:1;min-width:0;border:0;background:none;font-size:13.5px;font-weight:600;padding:10px 6px;border-radius:9px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block:4px 4px}
.filters select{flex:1;min-width:150px}
.sumline{font-size:13px;color:var(--ink2);margin-block:8px 0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);font-size:14px;padding:9px 13px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.swatch{width:40px;height:40px;border-radius:12px;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--bg)}
.swatch.on{border-color:var(--ink)}

.btn{font-weight:700;border-radius:12px;padding:12px 18px;border:1px solid transparent;cursor:pointer;min-height:48px}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:none;border-color:var(--line2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.actions.col{flex-direction:column}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.hint{font-size:13px;color:var(--ink2);margin:8px 0 0}
.amt small{font-weight:500;color:var(--ink2);font-size:12px}

.fld{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.fld>span,.lab{font-size:12.5px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=date],input[type=month],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px;width:100%;min-width:0}
textarea{resize:vertical}
.money{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding-inline:14px}
.money span{font-weight:700;color:var(--ink2)}
.money input{border:0;background:none;padding-block:8px;padding-inline:0;outline:none;font-family:var(--font-display);font-size:30px;font-weight:700}
.money:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--danger);font-weight:600;margin:12px 0 0;font-size:14px}

.backdrop{position:fixed;inset:0;background:rgba(10,12,11,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .2s ease-out}
.sheet h2{font-family:var(--font-display);font-size:20px;margin:0}
.sheet h3{font-size:14px;margin:22px 0 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border:0;background:var(--chip);border-radius:12px;display:grid;place-items:center;cursor:pointer}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}

.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line2);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .xl{fill:var(--muted);font-size:10px;font-family:var(--font-body);text-anchor:middle}
.chart .xsel{fill:var(--ink);font-weight:700}
.chart .band{fill:var(--chip)}
.chart .hit{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.readout{margin-block:8px 12px}
.rtitle{font-weight:700;margin-bottom:10px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.rgrid dt{font-size:12px;color:var(--ink2)}
.rgrid dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.trend{margin:10px 0 0;font-size:13px;color:var(--ink2)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;color:var(--ink2);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}

.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.bname{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.bname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bval{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.bval small{font-weight:500;color:var(--ink2);margin-left:6px;font-size:12.5px}
.track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--c)}

.cgroup h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 0}
.empty h2{font-family:var(--font-display);font-size:20px;margin:0 0 6px}
.empty p{margin:0 0 4px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Meu Bolso</div>
    <div class="status" id="status" role="status"></div>
  </header>
  <div id="banner" hidden></div>
  <main id="main" tabindex="-1"></main>
  <button class="fab" id="fab" data-act="fab" aria-label="Novo lançamento"></button>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
</div>
<div class="backdrop" id="backdrop" data-act="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
window.__STANDALONE__ = true;
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseDate = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth()+1);
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const ddmm = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1);
const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const compact = new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
const money = c => brl.format(c/100);
const moneySigned = c => (c < 0 ? '−' : '') + money(Math.abs(c));
const newId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseMoney(s){
  s = String(s).trim().replace(/[R$\s]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = Number(s);
  return isFinite(n) && n > 0 ? Math.round(n*100) : NaN;
}
const centsToField = c => (c/100).toFixed(2).replace('.',',');
function monthLabel(key){
  const p = key.split('-').map(Number);
  return cap(new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(p[0],p[1]-1,1)));
}
function shiftMonth(key,n){ const p = key.split('-').map(Number); return monthKey(new Date(p[0],p[1]-1+n,1)); }
function dayShort(s){
  const d = parseDate(s);
  return cap(new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d).replace('.','')) + ', ' + ddmm(d);
}
function dayLabel(s){
  const today = fmtDate(new Date()), yest = fmtDate(addDays(new Date(),-1));
  if(s === today) return 'Hoje, ' + ddmm(parseDate(s));
  if(s === yest) return 'Ontem, ' + ddmm(parseDate(s));
  return dayShort(s);
}
const I = (d,size) => '<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const ICON = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  prev:'<path d="M15 6l-6 6 6 6"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  go:'<path d="M9 6l6 6-6 6"/>'
};

/* ---------- categorias padrão ---------- */
const DEFAULT_CATS = [
  {id:'comida',name:'Comida',type:'out',color:1},
  {id:'combustivel',name:'Combustível',type:'out',color:3},
  {id:'moradia',name:'Moradia',type:'out',color:0},
  {id:'transporte',name:'Transporte',type:'out',color:2},
  {id:'lazer',name:'Lazer',type:'out',color:4},
  {id:'saude',name:'Saúde',type:'out',color:7},
  {id:'contas',name:'Contas',type:'out',color:6},
  {id:'outros-s',name:'Outros gastos',type:'out',color:5},
  {id:'salario',name:'Salário',type:'in',color:0},
  {id:'bicos',name:'Bicos',type:'in',color:2},
  {id:'outros-e',name:'Outras entradas',type:'in',color:3}
];
DEFAULT_CATS.forEach((c,i) => { c.order = i; });

/* ---------- estado ---------- */
const S = {
  tab:'resumo', month:monthKey(new Date()), fType:'all', fCat:'all',
  chart:'semana', asTable:false, sel:null, catMode:'out',
  tx:new Map(), cats:new Map(), cm:new Map(), demo:false, mode:'pending', cloudErr:false, note:''
};
let DEMO = null, form = null, lastTab = null;

const realTx = () => S.demo ? DEMO.tx : Array.from(S.tx.values());
const txs = () => realTx().concat(commitTx());
const cats = () => S.demo ? DEFAULT_CATS : Array.from(S.cats.values());
const catSort = (a,b) => ((a.order||0) - (b.order||0)) || String(a.name).localeCompare(String(b.name));
const catOf = id => cats().find(c => c.id === id) || {id:'__none__',name:'Sem categoria',type:'out',color:-1};
const colorVar = c => c.color >= 0 ? 'var(--s'+(c.color+1)+')' : 'var(--muted)';
const byDateDesc = (a,b) => b.date.localeCompare(a.date) || ((b.createdAt||0)-(a.createdAt||0)) || a.id.localeCompare(b.id);
const inMonth = t => t.date.slice(0,7) === S.month;
function sumsOf(list){ let i = 0, o = 0; list.forEach(t => { if(t.type === 'in') i += t.amount; else o += t.amount; }); return {in:i,out:o,bal:i-o}; }
function groupByCat(list){
  const m = new Map();
  list.forEach(t => {
    const c = catOf(t.catId); const e = m.get(c.id) || {cat:c,sum:0,n:0};
    e.sum += t.amount; e.n++; m.set(c.id,e);
  });
  return Array.from(m.values()).sort((a,b) => b.sum - a.sum);
}

/* ---------- parcelas e gastos fixos (viram lançamentos previstos em cada mês) ---------- */
const mIndex = k => { const p = k.split('-').map(Number); return p[0]*12 + p[1] - 1; };
const commits = () => S.demo ? DEMO.cm : Array.from(S.cm.values());
function occOf(c,m){
  const i = mIndex(m) - mIndex(c.start);
  if(i < 0) return null;
  if(c.kind === 'inst'){ if(i >= c.count) return null; }
  else if(c.end && m > c.end) return null;
  const p = m.split('-').map(Number), dim = new Date(p[0],p[1],0).getDate();
  return {i:i+1, date:m+'-'+pad(Math.min(c.day||1,dim))};
}
function commitTx(){
  const cs = commits(); if(!cs.length) return [];
  const now = monthKey(new Date());
  let lo = cs[0].start, hi = shiftMonth(now,12); if(S.month > hi) hi = S.month;
  cs.forEach(c => {
    if(c.start < lo) lo = c.start;
    if(c.kind === 'inst'){ const e = shiftMonth(c.start,c.count-1); if(e > hi) hi = e; }
    else if(c.end && c.end > hi) hi = c.end;
  });
  const out = []; let guard = 0;
  for(let m = lo; m <= hi && guard < 720; m = shiftMonth(m,1), guard++){
    cs.forEach(c => {
      const o = occOf(c,m); if(!o) return;

const LS_KEY = 'meubolso:v1';
let C = null;
const sigs = {}, ready = {tx:false,cats:false,cm:false};

async function retry(fn){
  try{ return await fn(); }
  catch(e){
    if(e && (e.code === 'unavailable' || e.code === 'resource_exhausted')){ await sleep(600 + Math.random()*400); return await fn(); }
    throw e;
  }
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({tx:Array.from(S.tx.values()),cats:Array.from(S.cats.values()),cm:Array.from(S.cm.values())})); S.note = ''; }
  catch(e){ S.note = 'Não deu para guardar neste navegador'; }
}
function initLocal(note){
  S.mode = 'local'; C = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const o = JSON.parse(raw);
      (o.tx||[]).forEach(t => S.tx.set(t.id,t));
      (o.cats||[]).forEach(c => S.cats.set(c.id,c));
      (o.cm||[]).forEach(c => S.cm.set(c.id,c));
    }
  }catch(e){}
  if(!S.cats.size) DEFAULT_CATS.forEach(c => S.cats.set(c.id,Object.assign({},c)));
  persist();
  if(note) S.note = note;
  render();
}
function snapIn(kind,snap){
  const sig = JSON.stringify(snap.docs.map(d => [d.id,d.data()]));
  if(sigs[kind] === sig && ready[kind]) return;
  if(snap.metadata && snap.metadata.fromCache && snap.empty && !ready[kind]) return;
  sigs[kind] = sig;
  const m = new Map(snap.docs.map(d => [d.id,Object.assign({id:d.id},d.data())]));
  if(kind === 'tx') S.tx = m; else if(kind === 'cats') S.cats = m; else S.cm = m;
  ready[kind] = true;
  if(ready.tx && ready.cats && ready.cm){ S.mode = 'cloud'; render(); }
}
async function initCloud(db,uid){
  const base = db.doc('data/users/'+uid+'/profile');
  const txCol = base.collection('tx'), catCol = base.collection('cats'), cmCol = base.collection('cm'), metaDoc = base.collection('meta').doc('seed');
  const seed = await metaDoc.get();
  if(!seed.exists){
    const ex = await catCol.limit(1).get();
    if(ex.empty){
      for(const c of DEFAULT_CATS){ await retry(() => catCol.doc(c.id).set({name:c.name,type:c.type,color:c.color,order:c.order})); }
    }
    await retry(() => metaDoc.set({seeded:true,at:Date.now()}));
  }
  C = {txCol:txCol,catCol:catCol,cmCol:cmCol};
  const onErr = () => { S.cloudErr = true; render(); };
  txCol.onSnapshot(s => snapIn('tx',s), onErr);
  catCol.onSnapshot(s => snapIn('cats',s), onErr);
  cmCol.onSnapshot(s => snapIn('cm',s), onErr);
  setTimeout(() => { if(S.mode === 'pending' && C){ ready.tx = ready.cats = ready.cm = true; S.mode = 'cloud'; render(); } }, 4000);
}
const store = {
  async init(){
    if(window.__STANDALONE__){ initLocal(); return; }
    try{
      for(let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await sleep(100);
      if(window.claude && window.claude.use){
        const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const db = r[0], user = r[1];
        const uid = user ? await user.id() : null;
        if(db && uid){ await initCloud(db,uid); return; }
      }
    }catch(e){
      initLocal('Sem conexão com a conta. Salvo só neste aparelho');
      return;
    }
    initLocal();
  },
  async saveTx(t){
    const body = {type:t.type,amount:t.amount,date:t.date,catId:t.catId,note:t.note||''};
    if(C){
      const prev = t.id ? S.tx.get(t.id) : null;
      body.createdAt = t.createdAt || (prev && prev.createdAt) || Date.now();
      const ref = t.id ? C.txCol.doc(t.id) : C.txCol.doc();
      await retry(() => ref.set(body));
    }else{
      const id = t.id || newId(), prev = S.tx.get(id);
      body.createdAt = t.createdAt || (prev && prev.createdAt) || Date.now();
      S.tx.set(id,Object.assign({id:id},body)); persist(); render();
    }
  },
  async deleteTx(id){
    if(C){ await retry(() => C.txCol.doc(id).delete()); }
    else{ S.tx.delete(id); persist(); render(); }
  },
  async saveCat(c){
    const body = {name:c.name,type:c.type,color:c.color,order:c.order};
    if(C){ await retry(() => C.catCol.doc(c.id).set(body)); }
    else{ S.cats.set(c.id,Object.assign({id:c.id},body)); persist(); render(); }
  },
  async deleteCat(id){
    if(C){ await retry(() => C.catCol.doc(id).delete()); }
    else{ S.cats.delete(id); persist(); render(); }
  },
  async saveCm(c){
    const body = {kind:c.kind,name:c.name,amount:c.amount,catId:c.catId,start:c.start,day:c.day,count:c.count||0,end:c.end||''};
    if(C){

      body.createdAt = c.createdAt || (prev && prev.createdAt) || Date.now();
      const ref = c.id ? C.cmCol.doc(c.id) : C.cmCol.doc();
      await retry(() => ref.set(body));
    }else{
      const id = c.id || newId(), prev = S.cm.get(id);
      body.createdAt = c.createdAt || (prev && prev.createdAt) || Date.now();
      S.cm.set(id,Object.assign({id:id},body)); persist(); render();
    }
  },
  async deleteCm(id){
    if(C){ await retry(() => C.cmCol.doc(id).delete()); }
    else{ S.cm.delete(id); persist(); render(); }
  }
};

function weekGroups(){

function monthGroups(){

    const d = new Date(now.getFullYear(),now.getMonth()-k,1);
    keys.push(monthKey(d));

function niceMax(m){
  const p = Math.pow(10,Math.floor(Math.log10(m)));
  const ks = [1,2,3,4,6,8,10];
  for(let i = 0; i < ks.length; i++){ if(ks[i]*p >= m) return ks[i]*p; }
  return 10*p;
}
function barPath(x,y,w,h,r){
  if(h <= 0) return '';
  r = Math.min(r,w/2,h);
  return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z';
}
function chartSvg(g,sel){
  const W = 360, H = 216, L = 44, R = 6, T = 16, B = 26, iw = W-L-R, ih = H-T-B;
  let max = 1; g.forEach(x => { max = Math.max(max,x.in,x.out); });
  const yMax = niceMax(max), y = v => T+ih-(v/yMax)*ih;
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de entradas e saídas por período">';
  s += '<text x="'+(L-6)+'" y="9" text-anchor="end" class="tick">R$</text>';
  for(let i = 0; i <= 4; i++){
    const v = yMax*i/4, yy = y(v);
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" class="'+(i?'grid':'axis')+'"/><text x="'+(L-6)+'" y="'+(yy+3.5)+'" text-anchor="end" class="tick">'+(i?compact.format(v/100):'0')+'</text>';
  }
  const gw = iw/g.length, bw = Math.min(16,gw*0.3), gap = 2;
  g.forEach((x,i) => {
    const cx = L+gw*i+gw/2, dim = i !== sel, op = dim ? 0.55 : 1;
    if(!dim) s += '<rect class="band" x="'+(L+gw*i+2)+'" y="'+T+'" width="'+(gw-4)+'" height="'+ih+'" rx="6"/>';
    const hi = (x.in/yMax)*ih, ho = (x.out/yMax)*ih;
    s += '<path d="'+barPath(cx-bw-gap/2,T+ih-hi,bw,hi,4)+'" fill="var(--s1)" opacity="'+op+'"/>';
    s += '<path d="'+barPath(cx+gap/2,T+ih-ho,bw,ho,4)+'" fill="var(--s2)" opacity="'+op+'"/>';
    s += '<text x="'+cx+'" y="'+(H-8)+'" class="xl'+(dim?'':' xsel')+'">'+esc(x.label)+'</text>';
    s += '<rect class="hit" x="'+(L+gw*i)+'" y="0" width="'+gw+'" height="'+H+'" fill="transparent" data-act="sel" data-i="'+i+'" role="button" aria-label="'+esc(x.title)+'"/>';
  });
  return s + '</svg>';
}
function trendText(g,i){

    : 'Seus lançamentos ficam só neste aparelho, dentro do app. Se você desinstalar o app, limpar os dados do navegador ou trocar de celular, eles somem. Faça um backup de vez em quando.';
  return '<div class="sec" style="margin-top:8px"><h2>Categorias</h2></div>'+grp('out','Saídas')+grp('in','Entradas')+
    '<div class="stack"><button class="btn ghost block" data-act="newcat">Nova categoria</button></div>'+
    '<div class="sec"><h2>Seus dados</h2></div><div class="card"><p style="margin:0 0 12px">'+where+'</p><button class="btn ghost block" data-act="bk-open">Backup: salvar ou restaurar</button></div>';
}

function cmRow(c,now){
  const st = cmStatus(c,now), cat = catOf(c.catId), i = mIndex(now) - mIndex(c.start);
  let sub;
  if(c.kind === 'inst'){
    if(st === 'future') sub = 'Começa em '+monthShort(c.start)+' · '+c.count+'x';
    else if(st === 'done') sub = 'Quitada · '+c.count+'x';
    else sub = 'Parcela '+(i+1)+' de '+c.count+' · faltam '+(c.count-i-1)+' · dia '+c.day;
  }else{
    if(st === 'future') sub = 'Começa em '+monthShort(c.start)+' · todo dia '+c.day;
    else if(st === 'done') sub = 'Encerrada em '+monthShort(c.end);
    else sub = 'Todo dia '+c.day+(c.end ? ' · até '+monthShort(c.end) : '');
  }
  return '<button class="row" data-act="editcm" data-id="'+esc(c.id)+'" style="--c:'+colorVar(cat)+'"><i class="dot"></i><span class="row-main"><span class="row-title">'+esc(c.name)+'</span><span class="row-sub">'+esc(sub)+'</span></span><span class="amt">'+money(c.amount)+'<small>/mês</small></span></button>';
}
function vParc(){
  const cs = commits().slice().sort((a,b) => String(a.name).localeCompare(String(b.name)));
  const now = monthKey(new Date()), cv = commitTx();
  const kindOf = new Map(cs.map(c => [c.id,c.kind]));
  const cur = cv.filter(t => t.date.slice(0,7) === now);
  const curSum = cur.reduce((a,t) => a+t.amount,0);
  const instSum = cur.filter(t => kindOf.get(t.cid) === 'inst').reduce((a,t) => a+t.amount,0);
  let rest = 0;
  cs.forEach(c => { if(c.kind !== 'inst') return; const i = mIndex(now) - mIndex(c.start); if(i >= c.count) return; rest += c.amount * (c.count - Math.max(0,i)); });
  let h = '<section style="margin-top:6px"><div class="eyebrow">Comprometido em '+esc(monthLabel(now).toLowerCase())+'</div><div class="big">'+money(curSum)+'</div>'+
    '<div class="pair"><div><span class="k">Parceladas</span><span class="v">'+money(instSum)+'</span></div><div><span class="k">Fixas</span><span class="v">'+money(curSum-instSum)+'</span></div></div></section>';
  if(!cs.length){
    return h + '<section class="card empty" style="margin-top:24px"><h2>Nenhuma compra parcelada ou fixa</h2><p>Cadastre aqui as parcelas (como um celular em 10x) e os gastos que se repetem todo mês (aluguel, internet, assinaturas). Eles entram sozinhos no saldo de cada mês.</p>'+
      '<div class="stack"><button class="btn primary block" data-act="newcm">Cadastrar o primeiro</button></div></section>';
  }
  h += '<p class="hint">Estes valores já entram sozinhos no saldo, nos gráficos e no Extrato de cada mês. Não precisa lançar de novo.</p>';
  if(rest > 0) h += '<p class="sumline">Falta pagar <b>'+money(rest)+'</b> em parcelas, contando este mês.</p>';
  const arr = []; let max = 0;
  for(let k = 0; k < 6; k++){ const m = shiftMonth(now,k), sum = cv.filter(t => t.date.slice(0,7) === m).reduce((a,t) => a+t.amount,0); arr.push({m:m,sum:sum}); if(sum > max) max = sum; }
  if(max > 0){
    h += '<div class="sec"><h2>Próximos meses</h2></div><ul class="blist">'+arr.map(r =>
      '<li style="--c:var(--s2)"><div class="bhead"><span class="bname"><b>'+esc(cap(monthShort(r.m)))+(r.m === now ? ' (atual)' : '')+'</b></span><span class="bval">'+money(r.sum)+'</span></div><div class="track"><div class="fill" style="width:'+(r.sum ? Math.max(r.sum/max*100,1.5) : 0).toFixed(1)+'%"></div></div></li>').join('')+'</ul>';
  }
  const act = cs.filter(c => cmStatus(c,now) !== 'done');
  const grp = (title,l) => l.length ? '<div class="cgroup"><h3>'+title+'</h3><div class="rows">'+l.map(c => cmRow(c,now)).join('')+'</div></div>' : '';
  h += grp('Parceladas',act.filter(c => c.kind === 'inst'))+grp('Fixas',act.filter(c => c.kind === 'fixed'))+grp('Encerradas',cs.filter(c => cmStatus(c,now) === 'done'));
  h += '<div class="stack"><button class="btn primary block" data-act="newcm">Novo compromisso</button></div>';
  return h;
}

function renderTabs(){
  const T = [
    ['resumo','Resumo','<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'],
    ['lanc','Extrato','<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'],
    ['parc','Parcelas','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
    ['graf','Gráficos','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],
    ['ajustes','Ajustes','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']
  ];
  $('#tabs').innerHTML = T.map(t => '<button class="tab" data-act="tab" data-t="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'><span class="ico">'+I(t[2])+'</span>'+t[1]+'</button>').join('');
}
function render(resetScroll){
  $('#status').textContent = S.cloudErr ? 'Sem conexão com a conta' : S.mode === 'pending' ? 'Conectando…' : S.mode === 'cloud' ? 'Salvo na sua conta' : (S.note || 'Salvo só neste aparelho');
  const b = $('#banner');
  if(S.demo){ b.hidden = false; b.className = 'banner'; b.innerHTML = '<span>Dados de exemplo. Nada disso é seu.</span><button class="link" data-act="demo-off">Sair do exemplo</button>'; }
  else { b.hidden = true; b.innerHTML = ''; }
  renderTabs();
  $('#fab').setAttribute('aria-label', S.tab === 'parc' ? 'Novo compromisso' : 'Novo lançamento');
  const m = $('#main');
  if(S.mode === 'pending'){ m.innerHTML = '<p class="muted pad">Carregando seus dados…</p>'; return; }
  const views = {resumo:vResumo,lanc:vLanc,parc:vParc,graf:vGraf,ajustes:vAjustes};
  const keep = (resetScroll || lastTab !== S.tab) ? 0 : m.scrollTop;
  m.innerHTML = views[S.tab]();
  m.scrollTop = keep; lastTab = S.tab;
}

async function saveCm(){
  syncCm();
  const f = form, name = f.name.trim(), cents = parseMoney(f.amount), isInst = f.ckind === 'inst';
  const count = parseInt(f.count,10), day = parseInt(f.day,10), start = (f.start||'').trim(), end = (f.end||'').trim();

function bkShowText(msg){
  const ta = $('#bk-text'); if(!ta) return;
  ta.value = backupJson(); ta.focus(); ta.select(); bkMsg(msg);
}
async function bkSave(){
  const name = 'meu-bolso-backup-'+fmtDate(new Date())+'.json';
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(!dl){
      try{
        const blob = new Blob([backupJson()],{type:'application/json'}), url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url),4000);
        bkMsg('Backup salvo na pasta de downloads do celular.');
      }catch(err){ bkShowText('Não deu para salvar arquivo aqui. Copie o texto selecionado e guarde em um lugar seguro.'); }
      return;
    }
    await dl.save({filename:name,data:backupJson()});
    bkMsg('Backup salvo.');
  }catch(e){
    if(e && e.code === 'declined') bkMsg('Cancelado.');
    else bkShowText('Não deu para salvar arquivo aqui. Copie o texto selecionado e guarde em um lugar seguro.');
  }
}
async function bkCopy(){
  const j = backupJson();
  try{ await navigator.clipboard.writeText(j); bkMsg('Texto copiado. Cole em um e-mail ou nota para guardar.'); }
  catch(e){ bkShowText('Copie o texto selecionado e guarde em um lugar seguro.'); }
}
async function bkRestore(){
  const ta = $('#bk-text'); let data;
  try{ data = JSON.parse(ta.value); }catch(e){ bkMsg('Não consegui ler esse texto. Confira se é um backup do Meu Bolso.'); return; }
  const cs = Array.isArray(data.categories) ? data.categories : [], ts = Array.isArray(data.transactions) ? data.transactions : [];
  const okC = cs.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string' && (c.type === 'in' || c.type === 'out'));
  const okT = ts.filter(t => t && typeof t.id === 'string' && (t.type === 'in' || t.type === 'out') && Number.isInteger(t.amount) && t.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date||''));
  const ms = Array.isArray(data.commitments) ? data.commitments : [];
  const okM = ms.filter(c => c && typeof c.id === 'string' && (c.kind === 'inst' || c.kind === 'fixed') && typeof c.name === 'string' && Number.isInteger(c.amount) && c.amount > 0 && typeof c.catId === 'string' && /^\d{4}-\d{2}$/.test(c.start||'') && Number.isInteger(c.day) && c.day >= 1 && c.day <= 31 && (c.kind === 'fixed' || (Number.isInteger(c.count) && c.count >= 1 && c.count <= 120)));
  if(data.app !== 'meu-bolso' || (!okC.length && !okT.length && !okM.length)){ bkMsg('Esse texto não parece um backup do Meu Bolso.'); return; }
  if(okT.length > 5000){ bkMsg('Backup grande demais (mais de 5000 lançamentos).'); return; }
  const safe = id => /^[A-Za-z0-9_.~:@+-]{1,100}$/.test(id) && id !== '.' && id !== '..';
  const total = okC.length + okT.length + okM.length; let n = 0;
  try{
    for(const c of okC){ if(!safe(c.id)) continue; await store.saveCat({id:c.id,name:String(c.name).slice(0,24),type:c.type,color:Math.min(7,Math.max(0,c.color|0)),order:c.order||0}); bkMsg('Restaurando '+(++n)+' de '+total+'…'); }
    for(const m of okM){ if(!safe(m.id)) continue; await store.saveCm({id:m.id,kind:m.kind,name:String(m.name).slice(0,40),amount:m.amount,catId:m.catId,start:m.start,day:m.day,count:m.kind === 'inst' ? m.count : 0,end:/^\d{4}-\d{2}$/.test(m.end||'') ? m.end : '',createdAt:m.createdAt||0}); n++; }
    for(const t of okT){ if(!safe(t.id)) continue; await store.saveTx({id:t.id,type:t.type,amount:t.amount,date:t.date,catId:String(t.catId||''),note:String(t.note||'').slice(0,80),createdAt:t.createdAt||0}); if(++n % 10 === 0) bkMsg('Restaurando '+n+' de '+total+'…'); }
    bkMsg('Pronto: '+okT.length+' lançamentos, '+okC.length+' categorias e '+okM.length+' compromissos restaurados.'); render();
  }catch(e){ bkMsg('A restauração parou no meio ('+n+' de '+total+'). Tente de novo: o que já entrou não duplica.'); }
}

/* ---------- eventos ---------- */
async function act(a,el){
  switch(a){
    case 'tab': S.tab = el.dataset.t; S.sel = null; render(true); break;
    case 'goto-cat': S.tab = 'graf'; S.chart = 'cat'; render(true); break;
    case 'mprev': S.month = shiftMonth(S.month,-1); render(); break;
    case 'mnext': S.month = shiftMonth(S.month,1); render(); break;
    case 'fab': if(S.tab === 'parc') newCm(); else newTx(); break;
    case 'newcm': newCm(); break;
    case 'editcm': editCm(el.dataset.id); break;
    case 'cmkind': syncCm(); form.ckind = el.dataset.v; redraw(cmSheetHtml()); break;
    case 'cmcat': syncCm(); form.catId = el.dataset.id; redraw(cmSheetHtml()); break;
    case 'cmsave': await saveCm(); break;
    case 'cmdel': await deleteCm(); break;
    case 'demo-on': S.demo = true; DEMO = DEMO || makeDemo(); render(true); break;
    case 'demo-off': S.demo = false; render(true); break;
    case 'lt': S.fType = el.dataset.v; render(); break;
    case 'ck': S.chart = el.dataset.k; S.sel = null; render(); break;
    case 'sel': S.sel = Number(el.dataset.i); render(); break;
    case 'tbl': S.asTable = !S.asTable; render(); break;
    case 'cm': S.catMode = el.dataset.v; render(); break;
    case 'edit': editTx(el.dataset.id); break;
    case 'editcat': editCat(el.dataset.id); break;
    case 'newcat': newCat(); break;
    case 'close': closeSheet(); break;
    case 'ftype': syncForm(); form.type = el.dataset.v; form.catId = firstCat(form.type); redraw(txSheetHtml()); break;
    case 'fcat': syncForm(); form.catId = el.dataset.id; redraw(txSheetHtml()); break;
    case 'fsave': await saveForm(); break;
    case 'fdel': await deleteForm(); break;
    case 'ctype': syncCat(); form.type = el.dataset.v; redraw(catSheetHtml()); break;
    case 'ccolor': syncCat(); form.color = Number(el.dataset.v); redraw(catSheetHtml()); break;
    case 'csave': await saveCat(); break;
    case 'cdel': await deleteCat(); break;
    case 'bk-open': form = {kind:'bk'}; openSheet(bkSheetHtml()); break;
    case 'bk-save': await bkSave(); break;
    case 'bk-copy': await bkCopy(); break;
    case 'bk-restore': await bkRestore(); break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(el) act(el.dataset.act,el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if(!el) return;
  if(el.dataset.change === 'fcatsel'){ S.fCat = el.value; render(); }
  if(el.dataset.change === 'bkfile' && el.files && el.files[0]){
    const fr = new FileReader();
    fr.onload = () => { const ta = $('#bk-text'); if(ta){ ta.value = String(fr.result||''); bkMsg('Arquivo lido. Toque em Restaurar.'); } };
    fr.onerror = () => bkMsg('Não consegui abrir esse arquivo.');
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if(!el || el.dataset.input !== 'cmcalc') return;
  const t = $('#cm-total'); if(!t) return;
  const a = $('#cm-amount'), c = $('#cm-count');
  const cents = parseMoney(a ? a.value : ''), n = parseInt(c ? c.value : '',10);
  t.textContent = cents && n > 0 ? 'Total: '+money(cents*n)+' em '+n+'x' : '';
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
$('#fab').innerHTML = I(ICON.plus,26);
render();
store.init();
})();
</script>
